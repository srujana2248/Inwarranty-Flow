name: Postman Collection Workflow
 
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 02 * * 1-5'
 
jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout the code
        uses: actions/checkout@v6.1.0
 
      - name: Setup Node.js environment
        uses: actions/setup-node@v6.5.0
        with:
          node-version: '22'
 
      - name: Install newman and htmlextra globally
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
 
      - name: Run the postman collection with newman
        run: |
          newman run 'Inwarrenty-flow collection.postman_collection.json' -e QA.postman_environment.json -r cli,htmlextra

      - name: Upload build artifcat Newman Report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Newman Report
          path: newman/*.html
        
           
